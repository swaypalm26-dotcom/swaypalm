<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwayPalm - Mombasa</title>
<style>body{font-family:system-ui;padding:20px;max-width:600px;margin:auto}button{background:#00a651;color:#fff;border:0;padding:14px 20px;border-radius:10px;width:100%;font-size:16px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.card{border:1px solid #eee;border-radius:14px;padding:16px;margin:12px 0}</style>
</head><body>
<h1>🌴 SwayPalm</h1><p>Businesses in Mombasa • Nairobi • Diani</p>
<div class="card"><h3>Advertise Your Business - $12</h3><p>Get Verified Badge ✓ + Top in Search for 30 days</p>
<input id="phone" placeholder="M-Pesa Phone e.g. 254712345678">
<input id="business" placeholder="Business Name">
<button onclick="pay()">Pay with M-Pesa</button><p id="msg"></p></div>
<div class="card"><h3>Raw Burmese Curly Hair - $245</h3><button onclick="window.open('https://wa.me/254712345678?text=Hi, I saw your Hair on SwayPalm for $245, is it available?')">Order on WhatsApp</button></div>
<script>
async function pay(){
  const phone=document.getElementById('phone').value;
  const business=document.getElementById('business').value;
  document.getElementById('msg').innerText='Sending STK Push to '+phone+'... Check your phone and enter M-Pesa PIN';
  await fetch('/api/mpesa-stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,business,amount:12})});
}
</script>
<p><a href="/admin.html">Admin Statement →</a></p>
</body></html>
<!-- MANUAL PAYBILL FALLBACK -->
<div style="margin-top:15px; padding:15px; border:1px dashed #22c55e; border-radius:12px; text-align:center;">
  <p style="font-weight:bold; margin:0;">Didn't get M-Pesa prompt?</p>
  <p style="font-size:14px; margin:8px 0;">
    Pay manually:<br>
    <b>Paybill: 247247</b><br>
    <b>Account: Your Phone Number</b><br>
    <b>Amount: Same amount</b>
  </p>
  <input id="mpesaCode" placeholder="Enter M-Pesa Code e.g. QK7X..." 
    style="padding:10px; width:90%; border-radius:8px; border:1px solid #ccc; text-align:center; text-transform:uppercase;" />
  <br><br>
  <button onclick="confirmManual()" 
    style="padding:12px 20px; background:#22c55e; color:white; border:none; border-radius:10px; font-weight:bold; width:100%;">
    I Have Paid - Confirm
  </button>
  <p id="manualMsg" style="font-size:13px; color:#16a34a;"></p>
</div>

<script>
function confirmManual(){
  const code = document.getElementById('mpesaCode').value.trim().toUpperCase();
  if(code.length < 8){
    alert('Please enter a valid M-Pesa code');
    return;
  }
  document.getElementById('manualMsg').innerText = '✅ Thanks! Code ' + code + ' received. We will verify and confirm on WhatsApp.';
  // Send to your WhatsApp for manual check
  window.open('https://wa.me/254705605477?text=' + encodeURIComponent('Hi SwayPalm, I paid manually. M-Pesa Code: ' + code), '_blank');
}
</script>
